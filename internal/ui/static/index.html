<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPG Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e7e9ea; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #2f3336; margin-bottom: 24px; }
    header h1 { font-size: 24px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
    .tab { padding: 8px 16px; border: 1px solid #2f3336; background: transparent; color: #8b98a5; cursor: pointer; border-radius: 6px; font-size: 14px; }
    .tab.active { background: #1d9bf0; color: white; border-color: #1d9bf0; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: #16202a; border: 1px solid #2f3336; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .card h3 { font-size: 16px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #8b98a5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-plugin { background: #1d4ed8; color: white; }
    .badge-external { background: #7c3aed; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #1d9bf0; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-success { background: #059669; color: white; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    input, select { padding: 8px 12px; border: 1px solid #2f3336; border-radius: 6px; background: #0f1419; color: #e7e9ea; font-size: 14px; width: 100%; }
    .form-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: end; }
    .form-group { flex: 1; }
    .form-group label { display: block; font-size: 12px; color: #8b98a5; margin-bottom: 4px; }
    .status { padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .status-success { background: #052e16; border: 1px solid #059669; color: #34d399; }
    .status-error { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; }
    .status-info { background: #0c1929; border: 1px solid #1d9bf0; color: #93c5fd; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2f3336; font-size: 13px; }
    th { color: #8b98a5; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { background: #16202a; border: 1px solid #2f3336; border-radius: 8px; padding: 16px; text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: #1d9bf0; }
    .stat-label { font-size: 12px; color: #8b98a5; margin-top: 4px; }
    .program-time { font-size: 12px; color: #8b98a5; }
    .program-meta { font-size: 12px; color: #1d9bf0; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { width: auto; min-width: 150px; }
    .xmltv-url { font-family: monospace; font-size: 13px; padding: 8px; background: #0f1419; border: 1px solid #2f3336; border-radius: 4px; word-break: break-all; }
    #status-msg { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>EPG Service</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="text" id="token-input" placeholder="API Token" style="width:180px;display:inline-block;font-size:12px;">
        <button class="btn" style="background:#374151;color:#9ca3af;" onclick="openSettings()">Settings</button>
      </div>
    </header>

    <div id="status-msg" class="status"></div>

    <div class="stats" id="stats"></div>


    <div id="sources">
      <div id="sources-list-view">
      <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
        <h2>Sources</h2>
        <button class="btn btn-success" onclick="grabAll()">Grab All Sources</button>
      </div>
      <div class="grid" id="plugin-sources"></div>

      <h2 style="margin:24px 0 16px;">External XMLTV Sources</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="ext-name" placeholder="e.g. uk-epg">
        </div>
        <div class="form-group">
          <label>URL</label>
          <input type="text" id="ext-url" placeholder="https://example.com/epg.xml">
        </div>
        <button class="btn btn-primary" onclick="addExternalSource()">Add</button>
      </div>
      <div class="grid" id="external-sources"></div>
    </div></div>

    <div id="source-detail-overlay" style="display:none;" class="panel active">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <button class="btn btn-primary" onclick="closeSourceDetail()">&larr; Back to Sources</button>
        <h2 id="source-detail-name"></h2>
      </div>
      <div class="tabs" style="margin-bottom:16px;">
        <button class="tab active" onclick="showDetailTab(this,'detail-channels')">Channels</button>
        <button class="tab" onclick="showDetailTab(this,'detail-programs')">Programs</button>
      </div>
      <div id="detail-channels">
        <table>
          <thead><tr><th>Name</th><th>XMLTV ID</th><th>Lang</th></tr></thead>
          <tbody id="channels-table"></tbody>
        </table>
      </div>
      <div id="detail-programs" style="display:none;">
        <table>
          <thead><tr><th>Time</th><th>Title</th><th>Channel</th><th>Category</th></tr></thead>
          <tbody id="programs-table"></tbody>
        </table>
      </div>
    </div>

    <div id="settings-overlay" style="display:none;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <button class="btn btn-primary" onclick="closeSettings()">&larr; Back</button>
        <h2>Settings</h2>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <h3>Full XMLTV URL</h3>
        <p class="xmltv-url" id="xmltv-full-url"></p>
        <button class="btn btn-primary" style="margin-top:8px;" onclick="copyXmltvUrl('xmltv-full-url')">Copy URL</button>
      </div>
      <h3 style="margin-bottom:12px;">Users</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="user-username" placeholder="username">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="user-role"><option value="admin">Admin</option><option value="viewer">Viewer</option></select>
        </div>
        <button class="btn btn-primary" onclick="createUser()">Create</button>
      </div>
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Token</th><th>Created</th><th></th></tr></thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = '/api/v1';
    let token = localStorage.getItem('epg-token') || '';
    document.getElementById('token-input').value = token;
    document.getElementById('token-input').addEventListener('change', e => {
      token = e.target.value;
      localStorage.setItem('epg-token', token);
      refreshAll();
    });

    function headers() {
      const h = {'Content-Type': 'application/json'};
      if (token) h['Authorization'] = 'Bearer ' + token;
      return h;
    }

    function copySourceXmltvUrl(name) {
      const base = window.location.origin;
      const tokenParam = token ? '?token=' + token : '';
      navigator.clipboard.writeText(base + '/epg/' + name + '.xml' + tokenParam);
      showStatus('XMLTV URL copied for ' + name, 'success');
    }

    function openSettings() {
      document.getElementById('sources').style.display = 'none';
      document.getElementById('source-detail-overlay').style.display = 'none';
      document.getElementById('settings-overlay').style.display = 'block';
      loadXmltvUrls();
      loadUsers();
    }

    function closeSettings() {
      document.getElementById('settings-overlay').style.display = 'none';
      document.getElementById('sources').style.display = 'block';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = 'status status-' + type;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }


    async function apiFetch(path, opts = {}) {
      const resp = await fetch(API + path, {headers: headers(), ...opts});
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(err);
      }
      return resp.json();
    }

    async function loadStats() {
      try {
        const [sources, channels, programs] = await Promise.all([
          apiFetch('/sources'),
          apiFetch('/channels'),
          apiFetch('/programs')
        ]);
        const extSources = await apiFetch('/external-sources').catch(() => []);
        document.getElementById('stats').innerHTML = `
          <div class="stat"><div class="stat-value">${(sources||[]).length + (extSources||[]).length}</div><div class="stat-label">Sources</div></div>
          <div class="stat"><div class="stat-value">${(channels||[]).length}</div><div class="stat-label">Channels</div></div>
          <div class="stat"><div class="stat-value">${(programs||[]).length}</div><div class="stat-label">Programs</div></div>
          <div class="stat"><div class="stat-value">${(sources||[]).length}</div><div class="stat-label">Plugins</div></div>
        `;
      } catch(e) { console.error(e); }
    }

    async function loadSources() {
      try {
        const sources = (await apiFetch('/sources')).sort((a,b) => a.name.localeCompare(b.name));
        const grabStats = await apiFetch('/grab-stats').catch(() => []);
        const statsMap = {};
        (grabStats||[]).forEach(s => statsMap[s.source] = s);

        document.getElementById('plugin-sources').innerHTML = (sources||[]).map(s => {
          const gs = statsMap[s.name];
          const total = s.total_channels || 0;
          const grabbed = gs ? gs.programs : 0;
          const grabbedCh = gs ? gs.channels : 0;
          const statusBadge = gs
            ? (gs.programs > 0
              ? `<span class="badge" style="background:#059669;color:white;">${gs.programs} progs / ${gs.channels} ch</span>`
              : `<span class="badge" style="background:#dc2626;color:white;">0 programs</span>`)
            : '<span class="badge" style="background:#374151;color:#9ca3af;">not grabbed</span>';
          const channelInfo = `<span style="font-size:12px;color:#8b98a5;">${total} channels</span>`;
          const lastGrab = gs ? `<span style="font-size:11px;color:#8b98a5;">Last: ${new Date(gs.last_grab).toLocaleString()} (${gs.duration})</span>` : '';
          const errorInfo = gs && gs.errors > 0 ? `<span style="font-size:11px;color:#fca5a5;"> ${gs.errors} errors</span>` : '';
          return `
            <div class="card">
              <h3>${s.name} ${statusBadge}</h3>
              <p>${s.description || ''}</p>
              <div style="margin-top:4px;">${channelInfo}</div>
              <div style="margin-top:2px;">${lastGrab}${errorInfo}</div>
              <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-success" onclick="grabSource('${s.name}')">Grab</button>
                <button class="btn btn-primary" onclick="openSourceDetail('${s.name}','channels')">Channels</button>
                ${gs && gs.programs > 0 ? `<button class="btn btn-primary" onclick="openSourceDetail('${s.name}','programs')">Programs</button>` : ''}
                <button class="btn" style="background:#374151;color:#9ca3af;" onclick="copySourceXmltvUrl('${s.name}')">Copy XMLTV URL</button>
              </div>
            </div>
          `;
        }).join('');

        const ext = await apiFetch('/external-sources').catch(() => []);
        document.getElementById('external-sources').innerHTML = (ext||[]).map(s => `
          <div class="card">
            <h3>${s.name} <span class="badge badge-external">${s.type}</span></h3>
            <p style="word-break:break-all;">${s.url}</p>
            <div style="margin-top:12px;">
              <button class="btn btn-success" onclick="grabExternal('${s.name}')">Grab</button>
              <button class="btn btn-danger" onclick="removeExternal('${s.name}')">Remove</button>
            </div>
          </div>
        `).join('');
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function grabAll() {
      try {
        showStatus('Grabbing all sources...', 'info');
        const res = await apiFetch('/grab-all', {method:'POST'});
        showStatus(`Grabbed ${res.total} programs from ${(res.sources||[]).length} sources (${res.errors} errors)`, 'success');
        refreshAll();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function grabSource(name) {
      try {
        showStatus('Grabbing ' + name + '...', 'info');
        const res = await apiFetch('/grab', {method:'POST', body: JSON.stringify({source: name})});
        showStatus(`Grabbed ${res.results} programs from ${name}`, 'success');
        refreshAll();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function addExternalSource() {
      const name = document.getElementById('ext-name').value;
      const url = document.getElementById('ext-url').value;
      try {
        await apiFetch('/external-sources', {method:'POST', body: JSON.stringify({name, url})});
        showStatus('Added external source: ' + name, 'success');
        document.getElementById('ext-name').value = '';
        document.getElementById('ext-url').value = '';
        loadSources();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function removeExternal(name) {
      try {
        await apiFetch('/external-sources/' + name, {method:'DELETE'});
        showStatus('Removed: ' + name, 'success');
        loadSources();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function grabExternal(name) {
      try {
        showStatus('Grabbing external source: ' + name + '...', 'info');
        const res = await apiFetch('/external-sources/' + name + '/grab', {method:'POST'});
        showStatus(`Imported ${res.channels} channels, ${res.programs} programs from ${name}`, 'success');
        refreshAll();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function openSourceDetail(source, tab) {
      document.getElementById('sources-list-view').style.display = 'none';
      document.getElementById('source-detail-overlay').style.display = 'block';
      document.getElementById('source-detail-name').textContent = source;

      try {
        const channels = await apiFetch('/channels?source=' + source);
        document.getElementById('channels-table').innerHTML = (channels||[]).sort((a,b) => a.name.localeCompare(b.name)).map(c => `
          <tr><td>${c.name}</td><td><code>${c.xmltv_id}</code></td><td>${c.lang}</td></tr>
        `).join('');
      } catch(e) {}

      try {
        const programs = await apiFetch('/programs?source=' + source);
        document.getElementById('programs-table').innerHTML = (programs||[]).slice(0, 500).map(p => `
          <tr>
            <td class="program-time">${new Date(p.start).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} - ${new Date(p.stop).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
            <td>${p.title}${p.sub_title ? '<br><span class="program-meta">' + p.sub_title + '</span>':''}</td>
            <td><code>${p.channel}</code></td>
            <td>${p.category||''}</td>
          </tr>
        `).join('');
      } catch(e) {}

      if (tab === 'programs') {
        document.getElementById('detail-channels').style.display = 'none';
        document.getElementById('detail-programs').style.display = 'block';
        document.querySelectorAll('#source-detail-overlay .tab').forEach((t,i) => t.classList.toggle('active', i===1));
      } else {
        document.getElementById('detail-channels').style.display = 'block';
        document.getElementById('detail-programs').style.display = 'none';
        document.querySelectorAll('#source-detail-overlay .tab').forEach((t,i) => t.classList.toggle('active', i===0));
      }
    }

    function closeSourceDetail() {
      document.getElementById('source-detail-overlay').style.display = 'none';
      document.getElementById('sources-list-view').style.display = 'block';
    }

    function showDetailTab(btn, tabId) {
      document.querySelectorAll('#source-detail-overlay .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('detail-channels').style.display = tabId === 'detail-channels' ? 'block' : 'none';
      document.getElementById('detail-programs').style.display = tabId === 'detail-programs' ? 'block' : 'none';
    }

    async function loadChannels() {
      const sources = (await apiFetch('/sources').catch(() => [])).sort((a,b) => a.name.localeCompare(b.name));
      const grabStats = await apiFetch('/grab-stats').catch(() => []);
      const statsMap = {};
      (grabStats||[]).forEach(s => statsMap[s.source] = s);

      document.getElementById('channel-source-list').innerHTML = `
        <div class="grid">${(sources||[]).map(s => {
          const gs = statsMap[s.name];
          const chCount = s.total_channels || 0;
          const progCount = gs ? gs.programs : 0;
          return `<div class="card" style="cursor:pointer;" onclick="showChannelsFor('${s.name}')">
            <h3>${s.name}</h3>
            <p>${chCount} channels${progCount ? ', ' + progCount + ' programs' : ''}</p>
          </div>`;
        }).join('')}</div>`;
      document.getElementById('channel-source-list').style.display = 'block';
      document.getElementById('channel-detail').style.display = 'none';
    }

    function showChannelSources() {
      document.getElementById('channel-source-list').style.display = 'block';
      document.getElementById('channel-detail').style.display = 'none';
    }

    async function showChannelsFor(source) {
      document.getElementById('channel-source-list').style.display = 'none';
      document.getElementById('channel-detail').style.display = 'block';
      document.getElementById('channel-detail-title').textContent = source;
      try {
        const channels = await apiFetch('/channels?source=' + source);
        document.getElementById('channels-table').innerHTML = (channels||[]).sort((a,b) => a.name.localeCompare(b.name)).map(c => `
          <tr><td>${c.name}</td><td><code>${c.xmltv_id}</code></td><td>${c.lang}</td></tr>
        `).join('');
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function loadPrograms() {
      const sources = (await apiFetch('/sources').catch(() => [])).sort((a,b) => a.name.localeCompare(b.name));
      const grabStats = await apiFetch('/grab-stats').catch(() => []);
      const statsMap = {};
      (grabStats||[]).forEach(s => statsMap[s.source] = s);

      document.getElementById('program-source-list').innerHTML = `
        <div class="grid">${(sources||[]).filter(s => statsMap[s.name] && statsMap[s.name].programs > 0).map(s => {
          const gs = statsMap[s.name];
          return `<div class="card" style="cursor:pointer;" onclick="showProgramsFor('${s.name}')">
            <h3>${s.name}</h3>
            <p>${gs.programs} programs, ${gs.channels} channels</p>
          </div>`;
        }).join('')}</div>`;
      if (!Object.values(statsMap).some(s => s.programs > 0)) {
        document.getElementById('program-source-list').innerHTML = '<p style="color:#8b98a5;">No programs grabbed yet. Grab a source first.</p>';
      }
      document.getElementById('program-source-list').style.display = 'block';
      document.getElementById('program-detail').style.display = 'none';
    }

    function showProgramSources() {
      document.getElementById('program-source-list').style.display = 'block';
      document.getElementById('program-detail').style.display = 'none';
    }

    async function showProgramsFor(source) {
      document.getElementById('program-source-list').style.display = 'none';
      document.getElementById('program-detail').style.display = 'block';
      document.getElementById('program-detail-title').textContent = source;
      try {
        const programs = await apiFetch('/programs?source=' + source);
        document.getElementById('programs-table').innerHTML = (programs||[]).slice(0, 500).map(p => `
          <tr>
            <td class="program-time">${new Date(p.start).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} - ${new Date(p.stop).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
            <td>${p.title}${p.sub_title ? '<br><span class="program-meta">' + p.sub_title + '</span>':''}</td>
            <td><code>${p.channel}</code></td>
            <td>${p.category||''}</td>
          </tr>
        `).join('');
      } catch(e) { showStatus(e.message, 'error'); }
    }

    function loadXmltvUrls() {
      const base = window.location.origin;
      const tokenParam = token ? '?token=' + token : '';
      const el = document.getElementById('xmltv-full-url');
      if (el) el.textContent = base + '/epg.xml' + tokenParam;
    }

    function copyXmltvUrl(id) {
      navigator.clipboard.writeText(document.getElementById(id).textContent);
      showStatus('URL copied to clipboard', 'success');
    }

    async function loadUsers() {
      try {
        const users = await apiFetch('/users');
        document.getElementById('users-table').innerHTML = (users||[]).map(u => `
          <tr>
            <td>${u.username}</td>
            <td>${u.role}</td>
            <td><code style="font-size:11px;">${u.token}</code></td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td><button class="btn btn-danger" onclick="deleteUser('${u.id}')">Delete</button></td>
          </tr>
        `).join('');
      } catch(e) { console.error(e); }
    }

    async function createUser() {
      const username = document.getElementById('user-username').value;
      const role = document.getElementById('user-role').value;
      try {
        const user = await apiFetch('/users', {method:'POST', body: JSON.stringify({username, role})});
        showStatus(`User created: ${user.username} (token: ${user.token})`, 'success');
        document.getElementById('user-username').value = '';
        loadUsers();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function deleteUser(id) {
      try {
        await apiFetch('/users/' + id, {method:'DELETE'});
        showStatus('User deleted', 'success');
        loadUsers();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    function refreshAll() {
      loadStats();
      loadSources();
      loadChannels();
      loadPrograms();
      loadXmltvUrls();
      loadUsers();
    }

    refreshAll();
  </script>
</body>
</html>
