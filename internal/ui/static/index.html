<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPG Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e7e9ea; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #2f3336; margin-bottom: 24px; }
    header h1 { font-size: 24px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
    .tab { padding: 8px 16px; border: 1px solid #2f3336; background: transparent; color: #8b98a5; cursor: pointer; border-radius: 6px; font-size: 14px; }
    .tab.active { background: #1d9bf0; color: white; border-color: #1d9bf0; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: #16202a; border: 1px solid #2f3336; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .card h3 { font-size: 16px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #8b98a5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-plugin { background: #1d4ed8; color: white; }
    .badge-external { background: #7c3aed; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #1d9bf0; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-success { background: #059669; color: white; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    input, select { padding: 8px 12px; border: 1px solid #2f3336; border-radius: 6px; background: #0f1419; color: #e7e9ea; font-size: 14px; width: 100%; }
    .form-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: end; }
    .form-group { flex: 1; }
    .form-group label { display: block; font-size: 12px; color: #8b98a5; margin-bottom: 4px; }
    .status { padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .status-success { background: #052e16; border: 1px solid #059669; color: #34d399; }
    .status-error { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; }
    .status-info { background: #0c1929; border: 1px solid #1d9bf0; color: #93c5fd; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2f3336; font-size: 13px; }
    th { color: #8b98a5; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { background: #16202a; border: 1px solid #2f3336; border-radius: 8px; padding: 16px; text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: #1d9bf0; }
    .stat-label { font-size: 12px; color: #8b98a5; margin-top: 4px; }
    .program-time { font-size: 12px; color: #8b98a5; }
    .program-meta { font-size: 12px; color: #1d9bf0; }
    .epg-container { border: 1px solid #2f3336; border-radius: 8px; overflow: auto; max-height: calc(100vh - 200px); position: relative; }
    .epg-header { display: flex; position: sticky; top: 0; z-index: 2; background: #0f1419; border-bottom: 1px solid #2f3336; }
    .epg-header-corner { min-width: 180px; max-width: 180px; padding: 8px 12px; font-size: 12px; color: #8b98a5; font-weight: 600; border-right: 1px solid #2f3336; position: sticky; left: 0; background: #0f1419; z-index: 3; }
    .epg-header-time { min-width: 240px; padding: 8px 12px; font-size: 12px; color: #8b98a5; border-right: 1px solid #2f3336; }
    .epg-row { display: flex; border-bottom: 1px solid #1a2332; min-height: 48px; }
    .epg-channel { min-width: 180px; max-width: 180px; padding: 8px 12px; font-size: 13px; font-weight: 600; border-right: 1px solid #2f3336; position: sticky; left: 0; background: #16202a; z-index: 1; display: flex; align-items: center; cursor: default; }
    .epg-channel:hover { background: #1c2b3a; }
    .epg-channel-tooltip { display: none; position: absolute; left: 100%; top: 50%; transform: translateY(-50%); background: #1a2332; border: 1px solid #2f3336; border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #8b98a5; white-space: nowrap; z-index: 10; margin-left: 4px; }
    .epg-channel:hover .epg-channel-tooltip { display: block; }
    .epg-programs { display: flex; position: relative; flex: 1; min-width: 0; }
    .epg-program { position: absolute; top: 2px; bottom: 2px; background: #1c2b3a; border: 1px solid #2f3336; border-radius: 4px; padding: 4px 8px; overflow: hidden; cursor: default; font-size: 12px; }
    .epg-program:hover { background: #243447; border-color: #1d9bf0; z-index: 1; }
    .epg-program-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .epg-program-time { font-size: 10px; color: #8b98a5; white-space: nowrap; }
    .epg-program.live { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; }
    .epg-program.past { opacity: 0.5; }
    .epg-now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #dc2626; z-index: 5; pointer-events: none; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { width: auto; min-width: 150px; }
    .xmltv-url { font-family: monospace; font-size: 13px; padding: 8px; background: #0f1419; border: 1px solid #2f3336; border-radius: 4px; word-break: break-all; }
    #status-msg { display: none; }
    .toggle-pill { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11px; font-weight: 600; padding: 3px 8px 3px 4px; border-radius: 12px; border: none; transition: background 0.15s; }
    .toggle-pill.enabled { background: rgba(5, 150, 105, 0.2); color: #34d399; }
    .toggle-pill.disabled { background: rgba(55, 65, 81, 0.5); color: #6b7280; }
    .toggle-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
    .toggle-pill.enabled .dot { background: #34d399; }
    .toggle-pill.disabled .dot { background: #6b7280; }
    .progress-band { display: flex; height: 5px; border-radius: 0 0 6px 6px; overflow: hidden; margin: 10px -16px -16px; }
    .progress-band-done { background: #059669; transition: width 0.3s; }
    .progress-band-outstanding { background: #1d9bf0; transition: width 0.3s; }
    .progress-band-error { background: #dc2626; transition: width 0.3s; }
    .progress-band-missing { background: #1e3a52; }
    .btn-icon { padding: 6px; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
    .btn-icon:hover { opacity: 0.85; }
    .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-remove { background: none; border: none; padding: 2px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: 0.8; }
    .btn-remove:hover { opacity: 1; }
    @keyframes grab-pulse { 0%,100% { border-color: #d97706; } 50% { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.4); } }
    .grabbing { animation: grab-pulse 1.2s ease-in-out infinite; }
    #bw-indicator { font-size: 12px; color: #8b98a5; font-family: monospace; }
    #bw-indicator.active { color: #1d9bf0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>EPG Service</h1>
      <div style="display:flex;align-items:center;gap:16px;">
        <span id="bw-indicator">↓ —</span>
        <button class="btn" style="background:#374151;color:#9ca3af;" onclick="openSettings()">Settings</button>
        <form method="POST" action="/logout" style="margin:0;">
          <button type="submit" class="btn" style="background:#374151;color:#9ca3af;">Logout</button>
        </form>
      </div>
    </header>

    <div id="status-msg" class="status"></div>

    <div class="stats" id="stats"></div>


    <div id="sources">
      <div id="sources-list-view">
      <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <h2>Sources</h2>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-primary" onclick="showAddExternal()">+ Add External Source</button>
          <button class="btn btn-success" onclick="grabAll()">Grab All</button>
        </div>
      </div>
      <div id="add-external-form" style="display:none;margin-bottom:16px;" class="card">
        <h3 style="margin-bottom:8px;">Add External XMLTV Source</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="ext-name" placeholder="e.g. uk-epg">
          </div>
          <div class="form-group">
            <label>URL</label>
            <input type="text" id="ext-url" placeholder="https://example.com/epg.xml or .xml.gz">
          </div>
          <button class="btn btn-primary" onclick="addExternalSource()">Add</button>
          <button class="btn" style="background:#374151;color:#9ca3af;" onclick="hideAddExternal()">Cancel</button>
        </div>
      </div>
      <div id="all-sources"></div>
    </div></div>

    <div id="guide-overlay" style="display:none;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <button class="btn btn-primary" onclick="closeGuide()">&larr; Back</button>
        <h2 id="guide-title"></h2>
        <select id="guide-region" style="display:none;padding:4px 8px;background:#16202a;color:#e7e9ea;border:1px solid #2f3336;border-radius:4px;font-size:13px;" onchange="onGuideRegionChange()"></select>
        <span id="guide-stats" style="font-size:13px;color:#8b98a5;"></span>
      </div>
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(-24)">-1d</button>
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(-6)">-6h</button>
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(-3)">-3h</button>
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(-1)">-1h</button>
        <button class="btn btn-primary" style="padding:4px 10px;font-size:12px;" onclick="guideNav(0)" id="guide-now-btn">Now</button>
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(1)">+1h</button>
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(3)">+3h</button>
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(6)">+6h</button>
        <button class="btn" style="background:#374151;color:#9ca3af;padding:4px 10px;font-size:12px;" onclick="guideNav(24)">+1d</button>
        <span id="guide-time-label" style="font-size:12px;color:#8b98a5;margin-left:8px;"></span>
      </div>
      <div class="epg-container" id="epg-container">
        <div class="epg-header" id="epg-header"></div>
        <div class="epg-body" id="epg-body"></div>
      </div>
    </div>

    <div id="settings-overlay" style="display:none;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <button class="btn btn-primary" onclick="closeSettings()">&larr; Back</button>
        <h2>Settings</h2>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <h3>Region Preferences</h3>
        <p style="font-size:12px;color:#8b98a5;margin-bottom:8px;">Comma-separated region codes in priority order. When a source has channels in multiple regions, only the first matching region is shown.</p>
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="region-prefs-input" placeholder="e.g. UK, US, DE, CH, FR" style="font-size:13px;">
          </div>
          <button class="btn btn-primary" onclick="saveRegionPrefs()">Save</button>
        </div>
        <p style="font-size:11px;color:#8b98a5;" id="region-prefs-current"></p>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <h3>Full XMLTV URL</h3>
        <p class="xmltv-url" id="xmltv-full-url"></p>
        <button class="btn btn-primary" style="margin-top:8px;" onclick="copyXmltvUrl('xmltv-full-url')">Copy URL</button>
      </div>
      <h3 style="margin-bottom:12px;">Users</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="user-username" placeholder="username">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="user-role"><option value="admin">Admin</option><option value="viewer">Viewer</option></select>
        </div>
        <button class="btn btn-primary" onclick="createUser()">Create</button>
      </div>
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Token</th><th>Created</th><th></th></tr></thead>
        <tbody id="users-table"></tbody>
      </table>
      <div id="change-password-form" style="display:none;margin-top:16px;" class="card">
        <h3 style="margin-bottom:8px;">Change Password</h3>
        <div class="form-row">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="new-password" placeholder="new password">
          </div>
          <button class="btn btn-primary" onclick="submitChangePassword()">Save</button>
          <button class="btn" style="background:#374151;color:#9ca3af;" onclick="cancelChangePassword()">Cancel</button>
        </div>
      </div>
      <div id="problem-sources" style="margin-top:24px;"></div>
    </div>
  </div>

  <script>
    const API = '/api/v1';

    function headers() {
      return {'Content-Type': 'application/json'};
    }

    function showAddExternal() {
      document.getElementById('add-external-form').style.display = 'block';
    }

    function hideAddExternal() {
      document.getElementById('add-external-form').style.display = 'none';
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return Promise.resolve();
    }

    function copySourceXmltvUrl(name) {
      const base = window.location.origin;
      copyToClipboard(base + '/epg/' + encodeURIComponent(name) + '.xml?token=<your-token>')
        .then(() => showStatus('XMLTV URL copied for ' + name + ' (replace <your-token>)', 'success'))
        .catch(() => showStatus('Copy failed — see browser console', 'error'));
    }

    async function openSettings() {
      document.getElementById('sources').style.display = 'none';
      document.getElementById('guide-overlay').style.display = 'none';
      document.getElementById('settings-overlay').style.display = 'block';
      const prefs = localStorage.getItem('epg-region-prefs') || '';
      document.getElementById('region-prefs-input').value = prefs;
      document.getElementById('region-prefs-current').textContent = prefs ? 'Current: ' + prefs : 'No region preferences set';
      loadXmltvUrls();
      loadUsers();
      loadSleepingSources();
    }

    async function grabSettingsSource(name) {
      try {
        grabbingSet.add(name);
        loadSources();
        loadSleepingSources();
        startProgressPolling();
        const res = await apiFetch('/grab', {method:'POST', body: JSON.stringify({source: name})});
        grabbingSet.delete(name);
        showStatus(`${name}: ${res.results} programs, ${res.errors} errors`, res.results > 0 ? 'success' : 'error');
      } catch(e) {
        grabbingSet.delete(name);
        showStatus(e.message, 'error');
      }
      refreshAll();
    }

    async function loadSleepingSources() {
      await loadDisabled();
      const grabStats = await apiFetch('/grab-stats').catch(() => []);
      const statsMap = {};
      (grabStats||[]).forEach(s => statsMap[s.source] = s);

      const allSources = await apiFetch('/sources').catch(() => []);
      const extSources = await apiFetch('/external-sources').catch(() => []);
      const all = [
        ...allSources.map(s => ({...s, _type: 'plugin', _grabFn: 'grabSource'})),
        ...(extSources||[]).map(s => ({...s, _type: 'external', _grabFn: 'grabExternal'}))
      ].sort((a,b) => a.name.localeCompare(b.name));

      const errored = all.filter(s => {
        const gs = statsMap[s.name];
        return gs && gs.errors > 0 && gs.programs === 0;
      }).sort((a,b) => (statsMap[b.name]?.errors||0) - (statsMap[a.name]?.errors||0));

      const nonResponsive = all.filter(s => {
        const gs = statsMap[s.name];
        return !gs || (gs.programs === 0 && gs.errors === 0);
      });

      let html = '';

      if (errored.length > 0) {
        html += `<h3 style="margin-bottom:12px;color:#dc2626;">Errored (${errored.length})</h3>`;
        html += `<p style="font-size:12px;color:#8b98a5;margin-bottom:12px;">These sources respond but return errors with no usable data.</p>`;
        html += '<div class="grid">' + errored.map(s => renderCard(s, statsMap, 'errored')).join('') + '</div>';
      }

      if (nonResponsive.length > 0) {
        html += `<h3 style="margin:24px 0 12px;color:#8b98a5;">Non-Responsive (${nonResponsive.length})</h3>`;
        html += `<p style="font-size:12px;color:#8b98a5;margin-bottom:12px;">Dead servers, geo-blocked, API removed, or never grabbed.</p>`;
        html += '<div class="grid">' + nonResponsive.map(s => renderCard(s, statsMap, 'non-responsive')).join('') + '</div>';
      }

      if (!html) {
        html = '<p style="color:#8b98a5;">All sources are active.</p>';
      }

      document.getElementById('problem-sources').innerHTML = html;
    }

    function renderCard(s, statsMap, context) {
      const gs = statsMap ? statsMap[s.name] : null;
      const safeNameAttr = (s.name||'').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const isGrabbing = grabbingSet.has(s._type === 'external' ? 'ext:' + s.name : s.name);
      const isExternal = s._type === 'external';
      const typeBadge = isExternal ? '<span class="badge" style="background:#7c3aed;color:white;font-size:10px;">external</span> ' : '';
      const statusBadge = isGrabbing
        ? '<span class="badge" style="background:#d97706;color:white;">grabbing...</span>'
        : context === 'errored'
          ? `<span class="badge" style="background:#dc2626;color:white;">${gs ? gs.errors + ' errors' : 'errored'}</span>`
          : context === 'non-responsive'
          ? `<span class="badge" style="background:#374151;color:#9ca3af;">non-responsive</span>`
          : gs
            ? (gs.programs > 0
              ? `<span class="badge" style="background:#059669;color:white;">${gs.programs} progs / ${gs.channels} ch</span>`
              : `<span class="badge" style="background:#dc2626;color:white;">0 programs</span>`)
            : '<span class="badge" style="background:#374151;color:#9ca3af;">not grabbed</span>';

      const subtitle = isExternal
        ? `<p style="word-break:break-all;font-size:11px;color:#8b98a5;">${s.url || ''}</p>`
        : (s.description ? `<p style="font-size:12px;color:#8b98a5;">${s.description}</p>` : '');
      const lastGrab = gs ? `<span style="font-size:11px;color:#8b98a5;">Last: ${new Date(gs.last_grab).toLocaleString()} (${gs.duration})</span>` : '';
      const errorInfo = gs && gs.errors > 0 ? `<span style="font-size:11px;color:#fca5a5;"> ${gs.errors} errors</span>` : '';
      const isErrored = context === 'errored';
      const isNonResponsive = context === 'non-responsive';
      const grabFnName = isExternal ? s._grabFn : 'grabSettingsSource';

      const dlIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
      const copyIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
      const removeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#dc2626"/><path d="M15 9l-6 6M9 9l6 6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>`;

      const grabBtn = isGrabbing
        ? `<button class="btn-icon" style="background:#d97706;color:white;" disabled title="Grabbing...">${dlIcon}</button>`
        : `<button class="btn-icon btn-success" style="background:#059669;color:white;" onclick="${grabFnName}('${safeNameAttr}')" title="Grab">${dlIcon}</button>`;
      const removeBtn = isExternal ? `<button class="btn-remove" onclick="removeExternal('${safeNameAttr}')" title="Remove">${removeIcon}</button>` : '';
      const guideBtn = gs && gs.programs > 0
        ? `<button class="btn btn-primary" onclick="openGuide('${safeNameAttr}')">Guide</button>` : '';
      const copyBtn = gs && gs.programs > 0
        ? `<button class="btn-icon" style="background:#374151;color:#9ca3af;" onclick="copySourceXmltvUrl('${safeNameAttr}')" title="Copy XMLTV URL">${copyIcon}</button>` : '';

      const isDisabled = disabledMap[s.name];
      const pillClass = isDisabled ? 'disabled' : 'enabled';
      const pillLabel = isDisabled ? 'Disabled' : 'Enabled';
      const pillBtn = `<button class="toggle-pill ${pillClass}" onclick="toggleDisabled('${safeNameAttr}')"><span class="dot"></span>${pillLabel}</button>`;

      const prog = progressData[s.name];
      let progressBand = '';
      if (prog) {
        const total = prog.total || 1;
        const donePct = Math.round((prog.done - prog.errors) / total * 100);
        const errorPct = Math.round(prog.errors / total * 100);
        const outstandingPct = Math.max(0, 100 - donePct - errorPct);
        progressBand = `<div class="progress-band" id="pb-${CSS.escape(s.name)}">
          <div class="progress-band-done" style="width:${donePct}%"></div>
          <div class="progress-band-error" style="width:${errorPct}%"></div>
          <div class="progress-band-outstanding" style="width:${outstandingPct}%"></div>
        </div>`;
      } else if (isGrabbing) {
        progressBand = `<div class="progress-band" id="pb-${CSS.escape(s.name)}">
          <div class="progress-band-outstanding" style="width:100%"></div>
        </div>`;
      } else if (gs && gs.total_channels > 0) {
        const okPct = Math.round(gs.channels / gs.total_channels * 100);
        const missingPct = 100 - okPct;
        progressBand = `<div class="progress-band" title="${gs.channels}/${gs.total_channels} channels with data">
          <div class="progress-band-done" style="width:${okPct}%"></div>
          <div class="progress-band-missing" style="width:${missingPct}%"></div>
        </div>`;
      }

      return `
        <div class="card${isGrabbing ? ' grabbing' : ''}" style="${isDisabled ? 'opacity:0.6;' : ''}${isErrored && !isGrabbing ? 'border-color:#dc2626;' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
            <h3 style="margin-bottom:0;">${typeBadge}${s.name} ${statusBadge}</h3>
            ${pillBtn}
          </div>
          ${subtitle}
          <div style="margin-top:2px;">${lastGrab}${errorInfo}</div>
          <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
            ${grabBtn}
            ${guideBtn}
            ${copyBtn}
            ${removeBtn}
          </div>
          ${progressBand}
        </div>
      `;
    }

    function closeSettings() {
      document.getElementById('settings-overlay').style.display = 'none';
      document.getElementById('sources').style.display = 'block';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = 'status status-' + type;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', type === 'error' ? 15000 : 5000);
    }


    async function apiFetch(path, opts = {}) {
      const resp = await fetch(API + path, {headers: headers(), credentials: 'same-origin', ...opts});
      if (resp.status === 401 || resp.status === 403) {
        window.location.href = '/login';
        return;
      }
      if (!resp.ok) {
        const text = await resp.text();
        let msg = text;
        try { const j = JSON.parse(text); if (j.error) msg = j.error; } catch(_) {}
        throw new Error(msg);
      }
      return resp.json();
    }

    async function loadStats() {
      try {
        const stats = await apiFetch('/stats');
        document.getElementById('stats').innerHTML = `
          <div class="stat"><div class="stat-value">${(stats.grab_stats||[]).filter(s => s.programs > 0).length}</div><div class="stat-label">Active</div></div>
          <div class="stat"><div class="stat-value">${stats.channels.toLocaleString()}</div><div class="stat-label">Channels</div></div>
          <div class="stat"><div class="stat-value">${stats.programs.toLocaleString()}</div><div class="stat-label">Programs</div></div>
          <div class="stat"><div class="stat-value">${stats.sources}</div><div class="stat-label">Sources</div></div>
        `;
      } catch(e) { console.error(e); }
    }

    async function loadSources() {
      try {
        const plugins = (await apiFetch('/sources')) || [];
        const ext = await apiFetch('/external-sources').catch(() => []);
        const grabStats = await apiFetch('/grab-stats').catch(() => []);
        const statsMap = {};
        (grabStats||[]).forEach(s => statsMap[s.source] = s);

        const all = [
          ...plugins.map(s => ({...s, _type: 'plugin', _grabFn: 'grabSource'})),
          ...(ext||[]).map(s => ({...s, _type: 'external', _grabFn: 'grabExternal'}))
        ].sort((a,b) => a.name.localeCompare(b.name));

        const active = all.filter(s => statsMap[s.name] && statsMap[s.name].programs > 0);

        let html = '';
        if (active.length > 0) {
          html += '<div class="grid">' + active.map(s => renderCard(s, statsMap, 'active')).join('') + '</div>';
        } else {
          html += '<p style="color:#8b98a5;">No active sources. Grab a source from Settings to get started.</p>';
        }
        const otherCount = all.length - active.length;
        if (otherCount > 0) {
          html += `<p style="margin-top:16px;font-size:12px;color:#8b98a5;">${otherCount} more source${otherCount>1?'s':''} available in Settings</p>`;
        }
        document.getElementById('all-sources').innerHTML = html;
      } catch(e) { showStatus(e.message, 'error'); }
    }

    const grabbingSet = new Set();
    let progressData = {};
    let progressInterval = null;

    async function loadProgress() {
      try {
        const data = await apiFetch('/grab-progress');
        progressData = data || {};
        const hasActive = Object.values(progressData).some(p => p.active);
        updateProgressBands();
        if (!hasActive && progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
      } catch(e) { /* silent */ }
    }

    let panelRefreshPending = false;
    function updateProgressBands() {
      let missingElement = false;
      for (const [name, prog] of Object.entries(progressData)) {
        if (!prog.active) continue;
        const el = document.getElementById('pb-' + CSS.escape(name));
        if (!el) { missingElement = true; continue; }
        const total = prog.total || 1;
        const donePct = Math.round((prog.done - prog.errors) / total * 100);
        const errorPct = Math.round(prog.errors / total * 100);
        const outstandingPct = Math.max(0, 100 - donePct - errorPct);
        el.innerHTML = `
          <div class="progress-band-done" style="width:${donePct}%"></div>
          <div class="progress-band-error" style="width:${errorPct}%"></div>
          <div class="progress-band-outstanding" style="width:${outstandingPct}%"></div>`;
      }
      if (missingElement && !panelRefreshPending) {
        panelRefreshPending = true;
        Promise.all([loadSources(), loadSleepingSources()]).then(() => { panelRefreshPending = false; });
      }
    }

    function startProgressPolling() {
      if (!progressInterval) {
        loadProgress();
        progressInterval = setInterval(loadProgress, 1000);
      }
    }

    async function grabAll() {
      try {
        const sources = await apiFetch('/sources');
        for (const s of sources) {
          grabbingSet.add(s.name);
        }
        loadSources();
        loadSleepingSources();
        startProgressPolling();
        showStatus('Grabbing all sources...', 'info');
        const res = await apiFetch('/grab-all', {method:'POST'});
        grabbingSet.clear();
        showStatus(`Grabbed ${res.total} programs from ${(res.sources||[]).length} sources (${res.errors} errors)`, 'success');
        refreshAll();
      } catch(e) {
        grabbingSet.clear();
        loadSources();
        showStatus(e.message, 'error');
      }
    }

    async function grabSource(name) {
      try {
        grabbingSet.add(name);
        loadSources();
        loadSleepingSources();
        startProgressPolling();
        const res = await apiFetch('/grab', {method:'POST', body: JSON.stringify({source: name})});
        grabbingSet.delete(name);
        showStatus(`Grabbed ${res.results} programs from ${name}`, 'success');
        refreshAll();
      } catch(e) {
        grabbingSet.delete(name);
        loadSources();
        showStatus(e.message, 'error');
      }
    }

    async function addExternalSource() {
      const name = document.getElementById('ext-name').value;
      const url = document.getElementById('ext-url').value;
      try {
        await apiFetch('/external-sources', {method:'POST', body: JSON.stringify({name, url})});
        showStatus('Added external source: ' + name, 'success');
        document.getElementById('ext-name').value = '';
        document.getElementById('ext-url').value = '';
        hideAddExternal();
        loadSources();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function removeExternal(name) {
      try {
        await apiFetch('/external-sources/' + encodeURIComponent(name), {method:'DELETE'});
        showStatus('Removed: ' + name, 'success');
        loadSources();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function grabExternal(name) {
      try {
        grabbingSet.add('ext:' + name);
        showStatus('Grabbing external source: ' + name + '...', 'info');
        await Promise.all([loadSources(), loadSleepingSources()]);
        startProgressPolling();
        const res = await apiFetch('/external-sources/' + encodeURIComponent(name) + '/grab', {method:'POST'});
        grabbingSet.delete('ext:' + name);
        showStatus(`Imported ${res.channels} channels, ${res.programs} programs from ${name}`, 'success');
        refreshAll();
      } catch(e) {
        grabbingSet.delete('ext:' + name);
        showStatus('External grab failed: ' + e.message, 'error');
        loadSources();
        loadSleepingSources();
      }
    }

    const PX_PER_MIN = 4;
    const HOURS_SHOWN = 6;
    const TOTAL_WIDTH = HOURS_SHOWN * 60 * PX_PER_MIN;

    let guideSource = '';
    let guideChannels = [];
    let guideProgsByChannel = {};
    let guideOffset = 0;

    let disabledMap = {};

    async function loadDisabled() {
      disabledMap = await apiFetch('/disabled').catch(() => ({}));
    }

    async function toggleDisabled(name) {
      const isDisabled = disabledMap[name];
      try {
        if (isDisabled) {
          await apiFetch('/disabled/' + encodeURIComponent(name), {method: 'DELETE'});
        } else {
          await apiFetch('/disabled/' + encodeURIComponent(name), {method: 'POST'});
        }
        await loadDisabled();
        loadSources();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    function getRegionPrefs() {
      const raw = localStorage.getItem('epg-region-prefs') || '';
      return raw.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
    }

    function saveRegionPrefs() {
      const val = document.getElementById('region-prefs-input').value;
      localStorage.setItem('epg-region-prefs', val);
      document.getElementById('region-prefs-current').textContent = 'Saved: ' + (val || '(none)');
    }

    function pickRegion(availableRegions) {
      const prefs = getRegionPrefs();
      if (prefs.length === 0 || availableRegions.length === 0) return '';
      for (const pref of prefs) {
        if (availableRegions.includes(pref)) return pref;
      }
      return '';
    }

    function deduplicateChannels(channels) {
      const prefs = getRegionPrefs();
      if (prefs.length === 0) return channels;

      const regions = [...new Set(channels.map(c => c.region).filter(Boolean))];
      if (regions.length <= 1) return channels;

      const bestRegion = pickRegion(regions);
      if (!bestRegion) return channels;

      const seen = new Map();
      const result = [];
      const regionChannels = channels.filter(c => c.region === bestRegion);
      const noRegionChannels = channels.filter(c => !c.region);

      for (const ch of regionChannels) {
        seen.set(ch.site_id, true);
        result.push(ch);
      }
      for (const ch of noRegionChannels) {
        if (!seen.has(ch.site_id)) {
          result.push(ch);
        }
      }

      return result;
    }

    let guideAllChannels = [];

    async function openGuide(source) {
      document.getElementById('sources').style.display = 'none';
      document.getElementById('guide-overlay').style.display = 'block';
      document.getElementById('guide-title').textContent = source;
      guideSource = source;
      guideOffset = 0;

      const [channels, programs] = await Promise.all([
        apiFetch('/channels?source=' + source),
        apiFetch('/programs?source=' + source)
      ]);

      guideAllChannels = (channels||[]).sort((a,b) => a.name.localeCompare(b.name));
      guideProgsByChannel = {};
      (programs||[]).forEach(p => {
        if (!guideProgsByChannel[p.channel]) guideProgsByChannel[p.channel] = [];
        guideProgsByChannel[p.channel].push(p);
      });

      const regions = [...new Set(guideAllChannels.map(c => c.region).filter(Boolean))].sort();
      const sel = document.getElementById('guide-region');

      if (regions.length > 1) {
        const defaultRegion = pickRegion(regions) || regions[0];
        sel.innerHTML = regions.map(r => {
          const count = guideAllChannels.filter(c => c.region === r).length;
          return `<option value="${r}" ${r === defaultRegion ? 'selected' : ''}>${r} (${count})</option>`;
        }).join('');
        sel.style.display = 'inline-block';
        applyGuideRegion(defaultRegion);
      } else {
        sel.style.display = 'none';
        guideChannels = guideAllChannels;
        updateGuideStats();
        renderGuide();
      }
    }

    function onGuideRegionChange() {
      applyGuideRegion(document.getElementById('guide-region').value);
    }

    function applyGuideRegion(region) {
      guideChannels = region
        ? guideAllChannels.filter(c => c.region === region)
        : guideAllChannels;
      updateGuideStats();
      renderGuide();
    }

    function updateGuideStats() {
      const progCount = guideChannels.reduce((sum, c) =>
        sum + (guideProgsByChannel[c.xmltv_id] || []).length, 0);
      document.getElementById('guide-stats').textContent =
        `${guideChannels.length} channels, ${progCount} programs`;
    }

    function guideNav(delta) {
      if (delta === 0) {
        guideOffset = 0;
      } else {
        guideOffset += delta;
      }
      const btn = document.getElementById('guide-now-btn');
      if (guideOffset === 0) {
        btn.textContent = 'Now';
      } else {
        const sign = guideOffset > 0 ? '+' : '';
        const abs = Math.abs(guideOffset);
        btn.textContent = abs >= 24 ? `${sign}${guideOffset/24}d` : `${sign}${guideOffset}h`;
      }
      renderGuide();
    }

    function renderGuide() {
      const now = new Date();
      const windowStart = new Date(now.getTime() + guideOffset * 3600000);
      windowStart.setMinutes(0, 0, 0);
      const windowStartMs = windowStart.getTime();
      const withData = guideChannels.filter(ch => (guideProgsByChannel[ch.xmltv_id] || []).length > 0);

      const nameCounts = {};
      withData.forEach(ch => { nameCounts[ch.name] = (nameCounts[ch.name] || 0) + 1; });

      const seenFingerprints = new Map();
      const activeChannels = [];
      for (const ch of withData) {
        const progs = guideProgsByChannel[ch.xmltv_id] || [];
        const fingerprint = progs.slice(0, 5).map(p => p.title + p.start).join('|');
        const key = ch.name + '::' + fingerprint;
        if (seenFingerprints.has(key)) continue;
        seenFingerprints.set(key, true);

        if (nameCounts[ch.name] > 1) {
          const feed = ch.xmltv_id.includes('@') ? ch.xmltv_id.split('@').pop() : ch.site_id;
          ch._displayName = ch.name + ' (' + feed + ')';
        } else {
          ch._displayName = ch.name;
        }
        activeChannels.push(ch);
      }

      const windowEndMs = windowStartMs + HOURS_SHOWN * 3600000;
      const nowMs = now.getTime();

      const fmtDate = d => d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
      const fmtTime = d => d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      document.getElementById('guide-time-label').textContent =
        fmtDate(windowStart) + ' ' + fmtTime(windowStart) + ' — ' + fmtTime(new Date(windowEndMs));

      let headerHtml = '<div class="epg-header-corner">Channel</div>';
      for (let h = 0; h < HOURS_SHOWN; h++) {
        const t = new Date(windowStartMs + h * 3600000);
        headerHtml += `<div class="epg-header-time">${fmtTime(t)}</div>`;
      }
      document.getElementById('epg-header').innerHTML = headerHtml;

      let bodyHtml = '';
      for (const ch of activeChannels) {
        const chProgs = (guideProgsByChannel[ch.xmltv_id] || [])
          .filter(p => new Date(p.stop).getTime() > windowStartMs && new Date(p.start).getTime() < windowEndMs)
          .sort((a,b) => new Date(a.start) - new Date(b.start));

        let progsHtml = '';
        for (const p of chProgs) {
          const startMs = Math.max(new Date(p.start).getTime(), windowStartMs);
          const stopMs = Math.min(new Date(p.stop).getTime(), windowEndMs);
          const leftPx = ((startMs - windowStartMs) / 60000) * PX_PER_MIN;
          const widthPx = Math.max(((stopMs - startMs) / 60000) * PX_PER_MIN - 2, 20);

          const isLive = nowMs >= new Date(p.start).getTime() && nowMs < new Date(p.stop).getTime();
          const isPast = new Date(p.stop).getTime() < nowMs;
          const cls = 'epg-program' + (isLive ? ' live' : '') + (isPast ? ' past' : '');

          const startStr = fmtTime(new Date(p.start));
          const stopStr = fmtTime(new Date(p.stop));
          const titleEsc = (p.title||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const descEsc = (p.description||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');

          progsHtml += `<div class="${cls}" style="left:${leftPx}px;width:${widthPx}px;" title="${titleEsc}\n${startStr}-${stopStr}\n${descEsc}">
            <div class="epg-program-title">${titleEsc}</div>
            <div class="epg-program-time">${startStr} - ${stopStr}</div>
          </div>`;
        }

        const nameEsc = (ch._displayName||ch.name||'').replace(/</g,'&lt;');
        bodyHtml += `<div class="epg-row">
          <div class="epg-channel">
            ${nameEsc}
            <div class="epg-channel-tooltip">
              <div><b>${nameEsc}</b></div>
              <div>XMLTV: ${ch.xmltv_id}</div>
              <div>Lang: ${ch.lang}</div>
              <div>Site ID: ${ch.site_id}</div>
            </div>
          </div>
          <div class="epg-programs" style="width:${TOTAL_WIDTH}px;min-width:${TOTAL_WIDTH}px;">
            ${progsHtml}
          </div>
        </div>`;
      }

      if (guideOffset === 0) {
        const nowPx = ((nowMs - windowStartMs) / 60000) * PX_PER_MIN;
        if (nowPx > 0 && nowPx < TOTAL_WIDTH) {
          bodyHtml += `<div class="epg-now-line" style="left:${180 + nowPx}px;"></div>`;
        }
      }

      document.getElementById('epg-body').innerHTML = bodyHtml;

      if (guideOffset === 0) {
        const container = document.getElementById('epg-container');
        const nowPx = ((nowMs - windowStartMs) / 60000) * PX_PER_MIN;
        const scrollTarget = nowPx - container.clientWidth / 2 + 180;
        if (scrollTarget > 0) container.scrollLeft = scrollTarget;
      }
    }

    function closeGuide() {
      document.getElementById('guide-overlay').style.display = 'none';
      document.getElementById('sources').style.display = 'block';
    }


    function loadXmltvUrls() {
      const base = window.location.origin;
      const el = document.getElementById('xmltv-full-url');
      if (el) el.textContent = base + '/epg.xml?token=<your-token>';
    }

    function copyXmltvUrl(id) {
      navigator.clipboard.writeText(document.getElementById(id).textContent);
      showStatus('URL copied to clipboard', 'success');
    }

    let changingPasswordUserId = null;

    async function loadUsers() {
      try {
        const users = await apiFetch('/users');
        document.getElementById('users-table').innerHTML = (users||[]).map(u => `
          <tr>
            <td>${u.username}</td>
            <td>${u.role}</td>
            <td><code style="font-size:11px;cursor:pointer;" onclick="navigator.clipboard.writeText('${u.token}');showStatus('Token copied','success')" title="Click to copy">${u.token.substring(0,16)}...</code></td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td style="white-space:nowrap;">
              <button class="btn" style="background:#374151;color:#9ca3af;font-size:11px;padding:2px 8px;" onclick="navigator.clipboard.writeText('${u.token}');showStatus('Token copied','success')">Copy Token</button>
              <button class="btn" style="background:#374151;color:#9ca3af;font-size:11px;padding:2px 8px;" onclick="showChangePassword('${u.id}','${u.username}')">Password</button>
              <button class="btn btn-danger" style="font-size:11px;padding:2px 8px;" onclick="deleteUser('${u.id}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch(e) { console.error(e); }
    }

    function showChangePassword(id, username) {
      changingPasswordUserId = id;
      document.getElementById('new-password').value = '';
      const form = document.getElementById('change-password-form');
      form.querySelector('h3').textContent = 'Change Password — ' + username;
      form.style.display = 'block';
      document.getElementById('new-password').focus();
    }

    function cancelChangePassword() {
      changingPasswordUserId = null;
      document.getElementById('change-password-form').style.display = 'none';
    }

    async function submitChangePassword() {
      const password = document.getElementById('new-password').value;
      if (!password) { showStatus('Password cannot be empty', 'error'); return; }
      try {
        await apiFetch('/users/' + changingPasswordUserId + '/password', {method:'PUT', body: JSON.stringify({password})});
        showStatus('Password changed', 'success');
        cancelChangePassword();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function createUser() {
      const username = document.getElementById('user-username').value;
      const role = document.getElementById('user-role').value;
      try {
        const user = await apiFetch('/users', {method:'POST', body: JSON.stringify({username, role})});
        showStatus(`User created: ${user.username} — token: ${user.token}`, 'success');
        document.getElementById('user-username').value = '';
        loadUsers();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function deleteUser(id) {
      try {
        await apiFetch('/users/' + id, {method:'DELETE'});
        showStatus('User deleted', 'success');
        loadUsers();
      } catch(e) { showStatus(e.message, 'error'); }
    }

    async function refreshAll() {
      await loadDisabled();
      loadStats();
      loadSources();
      loadXmltvUrls();
    }

    function fmtBytes(b) {
      if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
      if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
      if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
      return b + ' B';
    }

    async function pollBandwidth() {
      try {
        const bw = await apiFetch('/bandwidth');
        const el = document.getElementById('bw-indicator');
        const rate = bw.rate_bytes_per_sec || 0;
        const total = bw.total_bytes || 0;
        el.textContent = rate > 1024
          ? `↓ ${fmtBytes(rate)}/s · ${fmtBytes(total)} total`
          : `↓ — · ${fmtBytes(total)} total`;
        el.className = rate > 1024 ? 'active' : '';
      } catch {}
    }

    setInterval(pollBandwidth, 2000);
    pollBandwidth();

    refreshAll();
  </script>
</body>
</html>
